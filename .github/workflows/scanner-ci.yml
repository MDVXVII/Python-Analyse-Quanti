name: scanner-ci

on:
  push:
    paths: ["daily-stock-scanner/**", ".github/workflows/scanner-*.yml"]
  pull_request:
    paths: ["daily-stock-scanner/**", ".github/workflows/scanner-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: daily-stock-scanner

jobs:
  checks:
    name: Lint, typage, tests, démo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-stock-scanner/pyproject.toml
      - name: Installation
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format)
        run: ruff format --check src tests
      - name: Mypy
        run: mypy
      - name: Tests (hors réseau, y compris les tests longs du protocole)
        run: pytest -m "not network"
      - name: Démonstration hors ligne (données synthétiques)
        run: scanner demo --out demo-out
      - name: Rapport de démonstration (synthétique, sans donnée réelle)
        uses: actions/upload-artifact@v4
        with:
          name: rapport-demo-synthetique
          path: daily-stock-scanner/demo-out/reports/

  network-smoke:
    name: Providers sur réponses réelles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les API externes peuvent être instables : ce job informe, il ne bloque pas.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-stock-scanner/pyproject.toml
      - name: Installation
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Tests réseau (yfinance, Wikipédia, SEC si SEC_USER_AGENT est défini)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: pytest -m network -v
