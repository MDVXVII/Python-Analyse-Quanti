[project]
name = "daily-stock-scanner"
version = "0.1.0"
description = "Scanner d'actions quotidien : fondamental, quant, flux, actualité et macro, avec validation honnête."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.1",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "jinja2>=3.1",
    "exchange-calendars>=4.5",
    "yfinance>=0.2.40",
    "lxml>=5.0",
]

[project.optional-dependencies]
r2 = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[project.scripts]
scanner = "scanner.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test qui nécessite un accès réseau réel (exclu par défaut en CI)",
]
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = [
    "PD008",   # .at est plus lisible pour un accès scalaire
    "PD010",   # .pivot est adapté quand l'unicité est garantie
    "PD011",   # .values est utilisé volontairement sur des Series numériques
    "RUF001",  # caractères ambigus : le projet est rédigé en français
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PD", "B011"]

[tool.mypy]
python_version = "3.12"
packages = ["scanner"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*", "scipy.*", "boto3.*", "duckdb.*"]
ignore_missing_imports = true
