# Providers, priorités et limites.
# enabled: true | false | auto (auto = actif si la clé API correspondante est définie)

providers:
  sec_edgar:
    enabled: true
    rate_per_sec: 8            # limite SEC : 10 req/s ; on garde une marge
    cache_ttl_hours: 20
  yfinance:
    enabled: true
    pause_seconds: 0.3         # source non officielle, sujette aux limitations
  eodhd:
    enabled: auto
    rate_per_sec: 15
    cache_ttl_hours: 20
  finnhub:
    enabled: auto
    rate_per_sec: 0.9          # offre gratuite : 60 appels/min
    cache_ttl_hours: 12

# Ordre de priorité ; le premier provider disponible et en bonne santé est utilisé.
priority:
  prices: [eodhd, yfinance]
  fundamentals_us: [sec_edgar, eodhd]
  fundamentals_other: [eodhd, yfinance]
  earnings_dates_us: [sec_edgar, finnhub]
  constituents: [eodhd, local_csv, wikipedia]

# Décalages de publication conservateurs, utilisés UNIQUEMENT si la date de publication
# réelle est inconnue (les faits sont alors marqués lag_estimated=true).
publication_lags_days:
  annual: 120
  semiannual: 75
  quarterly: 60
